name: Construieste Director360
on:
  push:
    paths:
      - 'Director360*.zip'
      - '.github/workflows/director.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: director360
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dezarhiveaza (arhiva cu versiunea cea mai mare, oricum s-ar numi)
        run: |
          BEST=""; BV=-1
          for f in Director360*.zip; do
            [ -f "$f" ] || continue
            v=$(unzip -p "$f" versiune.txt 2>/dev/null | tr -dc '0-9')
            [ -z "$v" ] && v=0
            if [ "$v" -gt "$BV" ]; then BV=$v; BEST="$f"; fi
          done
          echo "Folosesc: $BEST (versiunea $BV)"
          mkdir d360 && unzip -o "$BEST" -d d360
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compileaza
        working-directory: d360
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee ../director-build-log.txt
      - name: Jurnal pentru Claude daca nu merge
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git pull -q --rebase || true
          tail -n 400 director-build-log.txt > director-eroare.txt
          git add -f director-eroare.txt
          git commit -m "Jurnal eroare Director360 [skip ci]"
          git push
      - name: Pregateste
        run: cp d360/app/build/outputs/apk/release/app-release.apk Director360.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: director-v${{ github.run_number }}
          name: Director360 - versiunea ${{ github.run_number }}
          body: Director360.apk - instaleaza-l pe telefon.
          files: Director360.apk
          make_latest: false
