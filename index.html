<style>

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}

.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}

.login{max-width:380px;margin:8vh auto 0;padding:0 16px}

async function doAuth(e,mode){
 e.preventDefault();const v=Object.fromEntries(new FormData(e.target));
 try{
  if(mode==="in"){
   const id=(v.id||"").trim();let email=id;
   if(!id.includes("@")){
    const r=await sb.rpc("login_identity",{p_id:id});
    if(r.error){authView(errMsg(r.error.message),mode);return false}
    email=r.data;if(!email){authView(t("noAcc"),mode);return false}
   }
   try{localStorage.setItem("ac_id",id)}catch(x){}
   const {error}=await sb.auth.signInWithPassword({email,password:v.password});
   if(error){authView(errMsg(error.message),mode);return false}
   await boot();
  }else if(mode==="up"){
   if(v.plate){
    const r=await sb.rpc("signup_identity2",{p_phone:v.phone,p_plate:v.plate});
    if(r.error){U.pre={name:v.name,phone:v.phone,password:v.password,needPlate:true};authView(errMsg(r.error.message),mode);return false}
    const {data,error}=await sb.auth.signUp({email:r.data,password:v.password});
    if(error){authView(errMsg(error.message),mode);return false}
    if(!data.session){authView(t("confirmMail"),"in");return false}
    const c=await sb.rpc("claim_client2",{p_phone:v.phone,p_plate:v.plate});
    if(c.error){await sb.auth.signOut();U.pre={name:v.name,phone:v.phone,password:v.password,needPlate:true};authView(errMsg(c.error.message),mode);return false}
    try{localStorage.setItem("ac_id",v.phone)}catch(x){}
    U.pre=null;await boot();return false;
   }
   const inf=await sb.rpc("signup_info",{p_phone:v.phone});
   if(inf.error){U.pre={name:v.name,phone:v.phone};authView(errMsg(inf.error.message),mode);return false}
   if(inf.data==="has_account"){try{localStorage.setItem("ac_id",v.phone)}catch(x){}U.pre=null;authView(L2("Ai deja cont. Intră cu telefonul și parola.","You already have an account. Log in with your phone and password."),"in",true);return false}
   if(inf.data==="existing"){U.pre={name:v.name,phone:v.phone,password:v.password,needPlate:true};authView("",mode);return false}
   const r=await sb.rpc("register_new_client",{p_name:v.name,p_phone:v.phone});
   if(r.error){authView(errMsg(r.error.message),mode);return false}
   const {data,error}=await sb.auth.signUp({email:r.data.email,password:v.password});
   if(error){authView(errMsg(error.message),mode);return false}
   if(!data.session){authView(t("confirmMail"),"in");return false}
   const c=await sb.rpc("claim_me");
   if(c.error){claimView(errMsg(c.error.message));return false}
   try{localStorage.setItem("ac_id",v.phone)}catch(x){}
   U.pre=null;await boot();try{sendPush(ME.client_id,"👤 Client nou",v.name+" · "+v.phone)}catch(x){}
  }else{
   const r=await sb.rpc("reset_password2",{p_phone:v.phone,p_plate:v.plate,p_pw:v.password});
   if(r.error){authView(errMsg(r.error.message),mode);return false}
   authView(t("resetOk"),"in",true);
  }
 }catch(x){authView(errMsg(x.message),mode)}
 return false;
}

async function enablePush(){
 try{
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)){alert("Acest browser nu permite notificări. Pe iPhone instalează mai întâi aplicația pe ecranul principal (Safari, Partajare, Adaugă pe ecranul principal) și deschide-o de acolo.");return}
  const perm=await Notification.requestPermission();
  if(perm!=="granted"){alert("Notificările nu au fost permise. Le poți permite din setările browserului, la permisiunile site-ului.");PS=await pushState();render();return}
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
  const j=sub.toJSON();
  const {error}=await sb.rpc("save_push",{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
  if(error){alert(error.message);return}
  PS="on";alert("Notificările sunt active pe acest telefon.");render();
 }catch(e){alert("Nu am putut activa notificările: "+(e.message||e))}
}

}

const ACC=[["Albastru","Blue","#1c4fd8","#6b9bff"],["Verde","Green","#1f8a5b","#4fd08f"],["Portocaliu","Orange","#d9730d","#f0a04a"],["Roșu","Red","#c0392b","#ff7f6e"],["Violet","Purple","#6b3fd4","#a98bff"],["Grafit","Graphite","#2b3a4a","#9fb3c8"]];
const svgURI=x=>'url("data:image/svg+xml,'+encodeURIComponent(x)+'")';
const PAT={dots:svgURI('<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"><circle cx="4" cy="4" r="1.6" fill="rgba(128,128,128,.28)"/></svg>'),

let TH={mode:"auto",acc:0,bg:"none",photo:null};try{TH=Object.assign(TH,JSON.parse(localStorage.getItem("ac_theme")))}catch(e){}
function saveTh(){try{localStorage.setItem("ac_theme",JSON.stringify(TH))}catch(e){alert("Poza e prea mare ca să fie salvată pe acest dispozitiv.");TH.photo=null;TH.bg="none"}}
function applyTheme(){
 const r=document.documentElement.style,dk=TH.mode==="dark"||(TH.mode==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
 const P=dk?{"--bg":"#0d1520","--card":"#162231","--ink":"#e9eef4","--mut":"#93a4b5","--line":"#263648","--ok":"#4fd08f","--amb":"#f0b04a","--bad":"#ff7f6e","--accink":"#0d1520"}:{"--bg":"#eef2f6","--card":"#fff","--ink":"#0f1b2d","--mut":"#5b6b7c","--line":"#d9e1e8","--ok":"#1f8a5b","--amb":"#b36b00","--bad":"#c0392b","--accink":"#fff"};
 Object.keys(P).forEach(k=>r.setProperty(k,P[k]));
 const a=ACC[TH.acc]||ACC[0];r.setProperty("--acc",dk?a[3]:a[2]);
 const b=document.body;if(!b)return;
 if(TH.bg==="photo"&&TH.photo){b.style.backgroundImage=`url(${TH.photo})`;b.style.backgroundSize="cover";b.style.backgroundPosition="center"}
 else if(PAT[TH.bg]){b.style.backgroundImage=PAT[TH.bg];b.style.backgroundSize="";b.style.backgroundPosition=""}
 else b.style.backgroundImage="none";
 b.style.backgroundAttachment="fixed";
}
function setTh(k,v){TH[k]=v;saveTh();applyTheme();render()}
function thPhoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);TH.photo=cv.toDataURL("image/jpeg",.6);TH.bg="photo";saveTh();applyTheme();render()};im.src=r.result};r.readAsDataURL(f)}

  else b=`<label class="lab">${t("car")}</label><select name="car_id">${cs.map(c=>`<option value="${c.id}" ${c.id===f.id?"selected":""}>${esc(c.plate)} · ${esc(c.make)} ${esc(c.model)}</option>`).join("")}</select><label class="lab">${t("reason")}</label>`+R("note",[[t("oilJob"),t("oilJob")],[t("beltJob"),t("beltJob")],[t("rev"),t("rev")],[t("other"),t("other")]])+I("wanted_on",t("date"),`type="date" min="${today}" required`)+I("wanted_time",t("time"),'type="time"')+I("more",t("more"));
 }
 return `<div class="ov" onclick="if(event.target===this){U.form=null;render()}"><form class="sheet" onsubmit="return sub(event)"><h2>${ttl}</h2>${b}<div class="row" style="margin-top:16px"><button class="btn" style="flex:1">${f.k==="appt"?t("send"):t("save")}</button><button type="button" class="btn g" onclick="U.form=null;render()">${t("cancel")}</button></div></form></div>`;
}

let PH=null;
function pickPhoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);PH=cv.toDataURL("image/jpeg",.7);const pv=document.getElementById("phv");if(pv){pv.src=PH;pv.style.display="block"}};im.src=r.result};r.readAsDataURL(f)}
function showImg(s){const d=document.createElement("div");d.className="ov";d.style.alignItems="center";d.onclick=()=>d.remove();d.innerHTML='<img src="'+s+'" style="max-width:96%;max-height:92vh;border-radius:10px;background:#fff">';document.body.appendChild(d)}
function editCar(id){PH=null;U.form={k:"caredit",id};render()}

const tmC=d=>{const x=new Date(d),l=LG==="ro"?"ro-RO":"en-GB";return x.toLocaleDateString(l)+" "+x.toLocaleTimeString(l,{hour:"2-digit",minute:"2-digit"})};
const bubC=(m,mine)=>`<div class="bub ${mine?"me":""}">${m.photo?`<img src="${m.photo}" alt="" onclick="showImg(this.src)" style="max-width:100%;max-height:220px;border-radius:8px;display:block;margin-bottom:6px">`:""}${esc(m.body||"").replace(/\n/g,"<br>")}<div style="font-size:11px;opacity:.7;margin-top:4px">${tmC(m.created_at)}</div></div>`;
let CD={text:"",photo:null};
const chatSeen=()=>{try{return localStorage.getItem("ac_chat_seen")||"1970"}catch(e){return"1970"}};
const chatUnread=()=>D.chat_messages.filter(m=>m.sender==="service"&&m.created_at>chatSeen()).length;
const markChat=()=>{try{localStorage.setItem("ac_chat_seen",new Date().toISOString())}catch(e){}};
function chatHtml(){const L=D.chat_messages.slice().sort((a,b)=>a.created_at.localeCompare(b.created_at));return L.length?L.map(m=>bubC(m,m.sender==="client")).join(""):`<p class="mut">${L2("Scrie service-ului. Răspunsul apare aici.","Write to the workshop. Replies appear here.")}</p>`}
function chatView(){
 markChat();
 return `<h2>💬 Chat</h2><div id="cm" style="padding-bottom:90px">${chatHtml()}</div><div class="cbar"><button class="btn g s" onclick="$('cp').click()">📷</button><input type="file" accept="image/*" id="cp" hidden onchange="chatPhoto(this)"><input id="ci" type="text" placeholder="${L2("Scrie un mesaj...","Write a message...")}" value="${esc(CD.text)}" oninput="CD.text=this.value" onkeydown="if(event.key==='Enter')chatSend()" style="flex:1"><span id="cpi" style="${CD.photo?"":"display:none"}">🖼️</span><button class="btn s" onclick="chatSend()">➤</button></div>`;
}
function chatRefresh(){const el=$("cm");if(el){el.innerHTML=chatHtml();markChat();window.scrollTo(0,document.body.scrollHeight)}}
function chatPhoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);CD.photo=cv.toDataURL("image/jpeg",.65);const i=$("cpi");if(i)i.style.display=""};im.src=r.result};r.readAsDataURL(f)}
async function chatSend(){
 const body=(CD.text||"").trim();if(!body&&!CD.photo)return;
 const {error}=await sb.from("chat_messages").insert({workshop_id:ME.workshop_id,client_id:ME.client_id,sender:"client",body:body||null,photo:CD.photo});
 if(error){alert(error.message);return}
 sendPush(ME.client_id,"💬 "+((D.client&&D.client.name)||"Client"),body||"📷 Poză");
 CD={text:"",photo:null};const i=$("ci");if(i)i.value="";const pi=$("cpi");if(pi)pi.style.display="none";
 const r=await sb.from("chat_messages").select("*");if(!r.error)D.chat_messages=r.data;chatRefresh();
}
setInterval(async()=>{
 if(!ME||document.hidden)return;
 const {data,error}=await sb.from("chat_messages").select("*");if(error)return;
 const before=D.chat_messages.length;D.chat_messages=data;if(data.length===before)return;
 if(U.tab==="chat"&&!U.carId)chatRefresh();
 else if(!U.form&&!B.open&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render();
},8000);
async function scanCarC(inp){
 const f=inp.files[0],st=document.getElementById("scst");if(!f)return;
 const say=(t,c)=>{if(st){st.textContent=t;st.style.color=c||""}};
 say("⏳ ...");
 try{
  const url=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);ok(cv.toDataURL("image/jpeg",.85))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)});
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch(SB_URL+"/functions/v1/scan",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":SB_KEY},body:JSON.stringify({image:url})});
  const d=await res.json();
  if(!res.ok||d.error){say(L2("Nu am reușit să citesc poza. Încearcă o poză mai clară, de aproape.","Could not read the photo. Try a closer, clearer one."),"#e5484d");return}
  const fm=inp.closest("form"),put=(n,v)=>{const e=fm.elements[n];if(e&&v&&!e.value)e.value=v};
  put("plate",d.plate);put("make",d.make);put("model",d.model);put("year",d.year);put("vin",d.vin);
  const n=["plate","vin","make","model","year"].filter(k=>d[k]).length;
  if(!n)say(L2("Nu am găsit date. Fă o poză clară talonului sau plăcuței cu seria.","No data found. Take a clear photo of the registration or VIN plate."),"#e5484d");
  else say(L2("✅ Am completat "+n+" câmpuri. Verifică-le și apasă Salvează.","✅ Filled "+n+" fields. Check them and tap Save."),"#1a9e57");
 }catch(e){say(L2("Nu am reușit. Verifică internetul și încearcă din nou.","Failed. Check the connection and try again."),"#e5484d")}
}
async function sub(e){
 e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),f=U.form;let p;
 if(f.k==="car")p=sb.rpc("add_my_car",{p_plate:v.plate,p_country:v.country,p_make:v.make,p_model:v.model,p_year:v.year||"",p_vin:v.vin||""});
 if(f.k==="appt"){if(!v.car_id){U.form=null;render();return false}p=sb.from("appointments").insert({workshop_id:ME.workshop_id,car_id:v.car_id,wanted_on:v.wanted_on,wanted_time:v.wanted_time||null,note:v.note+(v.more?" – "+v.more:""),status:"wait"})}
 if(f.k==="caredit"){const c=car(f.id);p=sb.rpc("client_update_car",{p_id:f.id,p_make:v.make,p_model:v.model,p_year:v.year||null,p_vin:v.vin||null,p_plate:c.confirmed?null:(v.plate||null),p_talon:PH})}
 if(f.k==="req"){if(!(v.text||"").trim())return false;p=sb.from("requests").insert({workshop_id:ME.workshop_id,client_id:ME.client_id,car_id:v.car_id||null,kind:"part",text:v.text.trim(),status:"new",source:"client"})}
 U.form=null;
 const okk=await run(p),cn=(D.client&&D.client.name)||"Client";
 if(okk){if(f.k==="appt")sendPush(ME.client_id,"📅 "+cn,"Cerere de programare");if(f.k==="req")sendPush(ME.client_id,"🔧 "+cn,v.text.trim());if(f.k==="car")sendPush(ME.client_id,"🚗 "+cn,"Mașină nouă de confirmat")}
 if(okk&&f.k==="appt"){U.tab="appts";U.carId=null;render();alert(t("sent"))}
 return false;
}
function op(k,id){U.form={k,id};render()}
function render(){
 if(U.tab!=="me")U.set=null;
 const v=U.carId?carDetail():U.tab==="home"?homeView():U.tab==="cars"?carsView():U.tab==="appts"?apptsView():U.tab==="chat"?chatView():U.tab==="msgs"?msgsView():meView();
 const bd=U.tab==="msgs"?0:D.notifications.filter(n=>n.created_at>seen()).length;
 const cu=U.tab==="chat"?0:chatUnread();const tabs=[["home","🏠",L2("Acasă","Home")],["cars","🚗",t("cars")],["chat","💬","Chat"],["me","👤",t("me")]];const hl=(U.tab==="appts"||U.tab==="msgs")?"home":U.tab;
 $("app").innerHTML=`${U.tab==="home"&&!U.carId?"":`<div class="bar"><div class="brand">${brandH()}</div></div>`}<main>${v}</main><nav>${tabs.map(x=>`<button class="${hl===x[0]&&!U.carId?"on":""}" onclick="U.tab='${x[0]}';U.carId=null;U.set=null;render()"><span>${x[1]}</span>${x[2]}${x[0]==="msgs"&&bd?`<b class="bdg">${bd}</b>`:""}${x[0]==="chat"&&cu?`<b class="bdg">${cu}</b>`:""}</button>`).join("")}</nav>${B.open||U.tab==="chat"?"":fab()}${U.form?formH():""}${B.open?botH():""}`;
 if(B.open){const m=$("bm");if(m)m.scrollTop=m.scrollHeight}
 if(U.tab==="chat"&&!U.carId)window.scrollTo(0,document.body.scrollHeight);
}
(async()=>{if(!sb){authView("Connection library not loaded.");return}try{const {data:{session}}=await sb.auth.getSession();session?boot():authView()}catch(x){authView(x.message)}})();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
